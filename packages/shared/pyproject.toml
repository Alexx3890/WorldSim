[project]
name = "worldsim-shared"
version = "0.1.0"
description = "Shared Pydantic schemas, typed config loader, and utilities for WorldSim AI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tomllib>=2.0; python_version < '3.11'",  # stdlib >=3.11
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldsim_shared"]
