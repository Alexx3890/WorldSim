[project]
name = "worldsim-llm-gateway"
version = "0.1.0"
description = "Gemini LLM provider abstraction and fallback chain for WorldSim"
requires-python = ">=3.12"
dependencies = [
    "worldsim-shared",
    "google-genai>=1.0",
    "tenacity>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldsim_llm_gateway"]
