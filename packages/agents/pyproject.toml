[project]
name = "worldsim-agents"
version = "0.1.0"
description = "LangGraph multi-agent orchestration for WorldSim"
requires-python = ">=3.12"
dependencies = [
    "worldsim-shared",
    "worldsim-llm-gateway",
    "langgraph>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldsim_agents"]
