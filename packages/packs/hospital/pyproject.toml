[project]
name = "worldsim-pack-hospital"
version = "1.0.0"
description = "Hospital Emergency Department scenario pack for WorldSim"
requires-python = ">=3.12"
dependencies = [
    "worldsim-shared",
    "worldsim-engine",
    "simpy>=4.1",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hospital_pack"]
