# Public Event Crowd & Venue Congestion — Distribution Parameters
# Source: Empirical arena crowd ingress safety studies and event operations engineering
# Version: 1.0.0

[security]
# Base inspection seconds (metal detector walkthrough)
base_screening_seconds = 7.0
# Proportion of attendees carrying bags requiring manual inspection
bag_check_prob = 0.38
# Additional bag search duration in seconds (Exponential)
bag_search_mean_seconds = 22.0

[turnstile]
# Automated ticket scan duration in seconds (Normal)
mean_scan_seconds = 3.2
scan_sigma = 0.8
# Barcode/RFID read error retry probability
scan_retry_prob = 0.07
retry_penalty_seconds = 8.0

[concessions]
# Probability of an attendee visiting a concession stand before event start
concession_visit_prob = 0.42
# Transaction service time in seconds (Lognormal)
service_lognormal_mu = 3.8
service_lognormal_sigma = 0.5

[costs]
security_guard_hourly_rate = 28.0         # USD per security officer per hour
turnstile_steward_hourly_rate = 22.0      # USD per gate attendant per hour
concession_worker_hourly_rate = 20.0      # USD per concession staff per hour
venue_power_overhead_hourly = 110.0       # USD stadium power and operations per hour
