[project]
name = "worldsim-engine"
version = "0.1.0"
description = "Domain-agnostic SimPy-backed simulation engine with Monte Carlo runner"
requires-python = ">=3.12"
dependencies = [
    "worldsim-shared",
    "simpy>=4.1",
    "numpy>=1.26",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldsim_engine"]
