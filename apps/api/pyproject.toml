[project]
name = "worldsim-api"
version = "0.1.0"
description = "WorldSim AI FastAPI gateway"
requires-python = ">=3.12"
dependencies = [
    "worldsim-shared",
    "worldsim-engine",
    "worldsim-pack-hospital",
    "worldsim-pack-college",
    "worldsim-pack-office",
    "worldsim-pack-policy",
    "worldsim-pack-social",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
